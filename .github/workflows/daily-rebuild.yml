name: Daily Rebuild & Freshness

on:
  schedule:
    # 每天 UTC 00:23（北京时间 08:23）触发一次自动重建与更新监控（避开 00:00~00:15 的高峰排队丢单）
    - cron: '23 0 * * *'
  workflow_dispatch: # 支持手动触发测试

permissions:
  contents: write
  issues: write

jobs:
  daily-rebuild:
    name: Trigger Daily Automated Freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Trigger Vercel Deploy Hook or Commit Ping
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Triggering Vercel rebuild via Deploy Hook..."
            curl -X POST "$VERCEL_DEPLOY_HOOK"
            echo "Deploy hook sent successfully."
          else
            echo "No VERCEL_DEPLOY_HOOK secret detected. Triggering rebuild via repository ping commit..."
            mkdir -p .github
            date -u +"%Y-%m-%d %H:%M:%S UTC" > .github/daily-ping.txt
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/daily-ping.txt
            git commit -m "chore(cron): automated daily build freshness $(date -u +'%Y-%m-%d')" || exit 0
            git push
            echo "Ping commit pushed to main branch. Vercel deployment triggered."
          fi

  watch-game-update:
    name: Watch Roblox Game Updates
    needs: daily-rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Roblox game stats
        run: |
          UA="fallenlineage-watcher/1.0 (+https://fallenlineage.org)"
          for i in 1 2 3; do
            echo "Attempt $i: Querying Roblox Game API..."
            if curl -sS -H "User-Agent: $UA" \
              "https://games.roblox.com/v1/games?universeIds=10771769549" -o game.json; then
              if grep -q '"data"' game.json; then
                echo "Successfully fetched Roblox stats."
                cat game.json | head -c 300
                echo ""
                break
              fi
            fi
            echo "Failed or rate limited, sleeping 20s before retry..."
            sleep 20
          done

      - name: Compare with last state and notify
        uses: actions/github-script@v7
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const https = require('https');
            let raw = '';
            try { raw = fs.readFileSync('game.json', 'utf8'); } catch(e) {}
            let json = null;
            try { json = JSON.parse(raw); } catch(e) {}

            if (!json || !json.data || !json.data.length) {
              console.log('No valid game data returned:', raw);
              return;
            }

            const d = json.data[0];
            const now = { updated: d.updated, visits: d.visits, playing: d.playing };
            let prev = {};
            try { prev = JSON.parse(fs.readFileSync('.github/game-state.json', 'utf8')); } catch(e) {}

            const lines = [];
            if (prev.updated && prev.updated !== now.updated) {
              lines.push(`- **游戏最后更新时间**：${prev.updated} → **${now.updated}**`);
            }
            if (prev.visits && now.visits - prev.visits > 0) {
              lines.push(`- **总访问量增长**：+${(now.visits - prev.visits).toLocaleString()}（累计 ${now.visits.toLocaleString()}）`);
            }

            if (lines.length) {
              // 1. 创建 GitHub Issue 存档
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨【Fallen Lineage 游戏可能更新了】· ${now.updated.slice(0, 10)}`,
                assignees: [context.repo.owner],
                body: [
                  `Hi @${context.repo.owner}（通知将直接推送至你的 QQ 邮箱 3171668917@qq.com）：`,
                  '',
                  '### 🎮 检测到游戏数据发生变更',
                  ...lines,
                  '',
                  '### 📋 建议处理步骤',
                  '- [ ] 访问 Roblox 游戏主页 / 官方 Discord 公告频道，确认本次是否包含新兑换码或职业平衡补丁',
                  '- [ ] 若有新码或机制调整：更新 `/codes` 码表或 `/tier-list`；若仅是底层 bugfix 无新码，保持页面冻结',
                  '- [ ] 同步在 `/updates` 页面追加更新补丁记录',
                  '',
                  `> 📊 当前在线人数：**${now.playing}** 人 | 当前累计访问：**${now.visits.toLocaleString()}** 次`,
                  `> 🔗 游戏 Universe ID: [10771769549](https://www.roblox.com/games/107948734900810)`
                ].join('\n')
              });
              console.log('GitHub Issue created successfully.');

              // 2. 直投 QQ 邮箱 (通过 Brevo SMTP API，不依赖脆弱的 Issue 邮件转发)
              const apiKey = process.env.BREVO_API_KEY;
              if (apiKey) {
                const emailPayload = JSON.stringify({
                  sender: { name: 'Fallen Lineage Monitor', email: 'support@fallenlineage.org' },
                  to: [{ email: '3171668917@qq.com', name: 'yangrenshi' }],
                  subject: `🚨【Fallen Lineage 游戏可能更新了】· ${now.updated.slice(0, 10)}`,
                  htmlContent: `
                    <div style="font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #121723; color: #f1f5f9; border-radius: 8px; border: 1px solid #262e45;">
                      <h2 style="color: #fbbf24; margin-top: 0;">🚨 Fallen Lineage 游戏检测到重大更新</h2>
                      <p style="color: #94a3b8; font-size: 14px;">Roblox 官方 API 监测到以下数据变动：</p>
                      <ul style="background: rgba(255,255,255,0.05); padding: 15px 25px; border-radius: 6px; font-size: 14px; line-height: 1.8;">
                        ${lines.map(l => `<li>${l.replace(/\*\*/g, '')}</li>`).join('')}
                      </ul>
                      <div style="background: #181e2e; padding: 12px 16px; border-radius: 6px; font-size: 13px; color: #cbd5e1; margin-bottom: 20px;">
                        <p style="margin: 4px 0;">🎮 <strong>当前在线人数：</strong> ${now.playing} 人</p>
                        <p style="margin: 4px 0;">📈 <strong>累计总访问：</strong> ${now.visits.toLocaleString()} 次</p>
                        <p style="margin: 4px 0;">⏱️ <strong>更新时间戳：</strong> ${now.updated}</p>
                      </div>
                      <h3 style="color: #f8fafc; font-size: 15px; border-bottom: 1px solid #262e45; padding-bottom: 6px;">💡 建议后续动作</h3>
                      <ol style="font-size: 13px; color: #94a3b8; line-height: 1.7; padding-left: 20px;">
                        <li>打开 Roblox 游戏页或官方 Discord 公告频道，确认是否有新兑换码或职业平衡补丁；</li>
                        <li>若有新码：向 AI 发送日常维护指令更新 <code>/codes</code> 码表；若无新码：继续保持页面稳定；</li>
                        <li>顺手同步更新 <code>/updates</code> 的更新日志。</li>
                      </ol>
                      <div style="margin-top: 25px; text-align: center;">
                        <a href="https://fallenlineage.org/codes" style="background: #fbbf24; color: #000; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 14px; display: inline-block;">访问 /codes 页面</a>
                      </div>
                    </div>
                  `
                });

                await new Promise((resolve) => {
                  const req = https.request({
                    hostname: 'api.brevo.com',
                    path: '/v3/smtp/email',
                    method: 'POST',
                    headers: {
                      'api-key': apiKey,
                      'Content-Type': 'application/json',
                      'Accept': 'application/json'
                    }
                  }, (res) => {
                    let data = '';
                    res.on('data', chunk => data += chunk);
                    res.on('end', () => {
                      console.log('Direct Brevo email sent successfully, HTTP status:', res.statusCode, data);
                      resolve();
                    });
                  });
                  req.on('error', (err) => {
                    console.error('Failed to send direct Brevo email:', err);
                    resolve();
                  });
                  req.write(emailPayload);
                  req.end();
                });
              }
            } else {
              console.log('No update detected compared to baseline.');
            }

            fs.mkdirSync('.github', { recursive: true });
            fs.writeFileSync('.github/game-state.json', JSON.stringify(now, null, 2));

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/game-state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(watch): update game state $(date -u +%F)"
            git pull --rebase origin main
            git push origin main
          else
            echo "No change in game-state.json. Nothing to commit."
          fi
